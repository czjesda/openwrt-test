
# REPO_TOKEN密匙制作教程：https://git.io/jm.md
#
#

name: Lede
on:
  workflow_dispatch:
    inputs:
      REPO_BRANCH:
        description: '（大雕源码）请选择源码分支'
        required: true
        default: 'master'
        type: choice
        options:
          - 'master'
      CONFIG_FILE:
        description: '请选择配置文件'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'aarch64'
          - 'asus_rt-acrh17'
          - 'newifi-d1'
          - 'newifi-d2'
          - 'p2w_r619ac-128m'
          - 'phicomm_k2p'
          - 'x86_32'
          - 'x86_64'
          - 'r2c'
          - 'r2s'
          - 'r3s'       
          - 'r4s'
          - 'r4se'
          - 'r5s'
          - 'r5c'          
          - 'xiaomi_mi-router-4a-gigabit'
          - 'xiaomi_redmi-router-ac2100'
          - 'xiaomi_redmi-router-ax6s'
          - 'xiaoyu_xy-c5'
          - 'ax3600'
          - 'xiaomi_mi-router-3g'
          - 'r68s'
          - 'r6s'
          - 'n1'
      CPU_SELECTION:
        description: 'CPU优选,增加编译速度(8573C=第五代至强,ubuntu-24.04机型池最新最快)'
        required: true
        default: '默认'
        type: choice
        options:
          - '8573C'
          - '默认'
          - '7763'
          - '8370C'
          - '8272CL'
          - '8171M'
      SSH_ACTION:
        description: 'SSH远程配置固件'
        required: false
        default: 'false'
        type: boolean
      UPLOAD_FIRMWARE:
        description: '上传固件到 Github Artifacts'
        required: false
        default: 'true'
        type: boolean
      UPLOAD_RELEASE:
        description: '发布固件到 Github Releases'
        required: false
        default: 'false'
        type: boolean
      CACHEWRTBUILD_SWITCH:
        description: '缓存加速编译'
        required: false
        default: 'true'
        type: boolean
      UPDATE_FIRMWARE_ONLINE:
        description: '增加在线更新固件功能/自动打包Amlogic_Rockchip系列固件'
        required: false
        default: 'false'
        type: boolean
      COMPILATION_INFORMATION:
        description: '是否显示编译信息'
        required: false
        default: 'true'
        type: boolean


# 定时触发开启开始编译(把下面两个#去掉开启,时间设置请看定时开启编译说明)
#  schedule:
#   - cron: 35 18 * * *

env:
  GITHUB_LINK: https://github.com/${{ github.repository }}
  GIT_ACTOR: ${{ github.actor }}
  GIT_REPOSITORY: ${{ github.repository }}
  RUN_NUMBER: ${{ github.run_number }}
  RUN_WORKFLOW: ${{ github.workflow }}
  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: 启动"${{ matrix.target }}-${{ github.event.inputs.REPO_BRANCH }}"触发编译
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    
    env:
      FOLDER_NAME: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [Lede]
        
        # 请勿对 target: [Lede] 做任何修改
        
    steps:
    - name: 密匙检测（密匙为空则退出）
      run: |
        cd ${GITHUB_WORKSPACE}
        if [[ -z "${REPO_TOKEN}" ]]; then
          echo "您没有设置仓库密匙，请按教程设置好密匙再来"
          exit 1
        fi
        
        
    - name: 准备结束
      uses: actions/checkout@v4

      - name: 检查 common.sh 语法
      run: |
        bash -n common/common.sh

    - name: 检测文件和对比上游版本
      run: |
        cd ${GITHUB_WORKSPACE}
        bash common/custom/first.sh
        source ${GITHUB_WORKSPACE}/build/${{ env.FOLDER_NAME }}/settings.ini
        export INPUTS_REPO_BRANCH="${{ github.event.inputs.REPO_BRANCH }}"
        export INPUTS_CONFIG_FILE="${{ github.event.inputs.CONFIG_FILE }}"
        export INPUTS_CPU_SELECTION="${{ github.event.inputs.CPU_SELECTION }}"
        export INPUTS_SSH_ACTION="${{ github.event.inputs.SSH_ACTION }}"
        export INPUTS_UPLOAD_FIRMWARE="${{ github.event.inputs.UPLOAD_FIRMWARE }}"
        export INPUTS_UPLOAD_RELEASE="${{ github.event.inputs.UPLOAD_RELEASE }}"
        export INPUTS_CACHEWRTBUILD_SWITCH="${{ github.event.inputs.CACHEWRTBUILD_SWITCH }}"
        export INPUTS_UPDATE_FIRMWARE_ONLINE="${{ github.event.inputs.UPDATE_FIRMWARE_ONLINE }}"
        export INPUTS_COMPILATION_INFORMATION="${{ github.event.inputs.COMPILATION_INFORMATION }}"
        source build/${{ env.FOLDER_NAME }}/common.sh && Diy_menu1

    - name: 部署编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq install -y gawk git gettext libssl-dev xsltproc zip git-core wget curl grep python3 python3-pip libpython3-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /${{ env.DIY_WORK }}
        sudo chown $USER:$GROUPS /${{ env.DIY_WORK }}
        # 安装pyelftools模块，用于u-boot编译
        pip3 install pyelftools        
    
    - name: 下载"${{ matrix.target }}-${{ github.event.inputs.REPO_BRANCH }}"源码
      working-directory: /${{ env.DIY_WORK }}
      run: |
        git clone -b "${REPO_BRANCH}" --single-branch "${REPO_URL}" openwrt
        ln -sf /${{ env.DIY_WORK }}/openwrt ${GITHUB_WORKSPACE}/openwrt
        cp -Rf ${GITHUB_WORKSPACE}/build ${GITHUB_WORKSPACE}/openwrt/build
        chmod -R +x ${GITHUB_WORKSPACE}/openwrt/build
        
    - name: 修改 feeds.conf.default
      run: |
       cd openwrt
       # 判断是否为 LEDE 编译
       if [ "$SOURCE_CODE" == "COOLSNOWWOLF" ]; then
       echo "正在编译 LEDE，启用 luci feed"
       # 使用 sed 修改 feeds.conf.default 文件
       sed -i 's@src-git luci@# src-git luci@g' feeds.conf.default
       sed -i 's@## src-git luci@src-git luci@g' feeds.conf.default
       else
       echo "不是 LEDE 编译，跳过 luci feed 配置"
       fi
    
    - name: 公 告
      if: ${{ env.REPO_TOKEN != '' }}
      run: |
        cd ${GITHUB_WORKSPACE}
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu2
 
    - name: 更新插件源
      if: ${{ env.REPO_TOKEN != '' }}
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu3
 
    - name: 加载自定义设置
      if: ${{ env.REPO_TOKEN != '' }}
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu4
        
    - name: 安装插件源
      if: ${{ env.REPO_TOKEN != '' }}
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu5
    
    - name: SSH远程连接服务器
      if: ${{ env.SSH_ACTIONS == 'true' || github.event.inputs.SSH_ACTION == 'true' }}
      timeout-minutes: 120
      run: |
        chmod +x ${GITHUB_WORKSPACE}/openwrt/build/debug-ssh.sh
        /bin/bash "${GITHUB_WORKSPACE}/openwrt/build/debug-ssh.sh"

    - name: SSH远程调试
      if: ${{ env.Build_SSH == 'true' }}
      timeout-minutes: 32
      run: |
        chmod +x ${GITHUB_WORKSPACE}/openwrt/build/debug-ssh.sh
        /bin/bash "${GITHUB_WORKSPACE}/openwrt/build/debug-ssh.sh"

    - name: 调试结束
      run: |
        if [[ "${BUILD_MOD}" == "true" ]]; then
          echo "当前处于调试模式，环境配置已完成，跳过编译步骤。"
          exit 0
        fi
        

    - name: 生成"${{ matrix.target }}"配置文件
      if: ${{ env.REPO_TOKEN != '' }}
      id: compile
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_menu6
        
    - name: 上传"${{ matrix.target }}"配置文件在 Github Artifacts
      if: ${{ steps.compile.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: .config_${{ env.SOURCE }}_${{ env.LUCI_EDITION }}_${{ env.TARGET_PROFILE }}_${{ env.Firmware_Date }}
        path: openwrt/build_logo/config.txt
        
    - name: 编译信息
      continue-on-error: true
      if: ${{ env.COMPILATION_INFORMATION == 'true' }}
      run: |
        cd openwrt
        source ${BUILD_PATH}/common.sh && Diy_xinxi
    
    - name: 清理Actions空间(测试期禁用,防误删并行run)
      continue-on-error: true
      if: false
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.REPO_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: ${{ env.RETAIN_MINUTE }}
    
    - name: 清理releases(测试期禁用,action为漂浮引用)
      continue-on-error: true
      if: false
      uses: ophub/delete-releases-workflows@main
      with:
        delete_releases: true
        releases_keep_keyword: targz/Update
        releases_keep_latest: ${{ env.KEEP_LATEST }}
        delete_tags: true
        delete_workflows: false
        workflows_keep_day: 90
        gh_token: ${{ secrets.REPO_TOKEN }}
        
    - name: 触发启动"${{ matrix.target }}"开始编译
      id: gitpush
      if: ${{ steps.compile.outcome == 'success' && env.REPO_TOKEN != '' }}
      run: |
        cd ${GITHUB_WORKSPACE}
        source ${BUILD_PATH}/common.sh && build_openwrt
